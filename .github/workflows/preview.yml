# Each pull request gets its own Neon branch and its own Hyperdrive config, and
# is deployed to the separate workwarden-preview Worker, so a preview never
# touches production data. preview-cleanup.yml removes the branch and config
# when the PR closes.
#
# A deploy rather than `versions upload`: Cloudflare does not generate preview
# URLs for a Worker with a Durable Object, which this has for live sync. There is
# one preview Worker, so two PRs previewing at once would overwrite each other;
# for a single-maintainer repository that is an acceptable trade.
name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: flat-heart-18148850
  RESOURCE: pr-${{ github.event.number }}

jobs:
  preview:
    # Dependabot pull requests are not given repository secrets, so a preview
    # would fail on the first API call and make every bump look broken.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # A branch is a copy-on-write clone, so this is near-instant and isolated.
      # Reset, not reused: a preview carries the migrations it ran last time,
      # and a newer master can add one that sorts before them.
      - name: Neon branch for this PR
        id: neon
        run: |
          uri=$(node scripts/neon-branch.mjs reset "$RESOURCE")
          echo "::add-mask::$uri"
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - name: Migrate the PR branch
        run: npm run migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}

      - name: Hyperdrive config for this PR
        id: hyperdrive
        run: |
          id=$(node scripts/hyperdrive.mjs upsert "workwarden-$RESOURCE" "$URI")
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          URI: ${{ steps.neon.outputs.uri }}

      # The preview environment carries a placeholder id; swap in this PR's
      # config. Never the top-level id, which is production's.
      - name: Point the preview binding at the PR config
        run: |
          node -e '
            const fs = require("node:fs")
            const f = "wrangler.jsonc"
            const s = fs.readFileSync(f, "utf8")
            const placeholder = "00000000000000000000000000000000"
            if (!s.includes(placeholder)) throw new Error("preview placeholder id not found")
            fs.writeFileSync(f, s.replace(placeholder, process.env.HYPERDRIVE_ID))
          '
        env:
          HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}

      - name: Deploy the preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview

      # Throwaway secrets, generated here. The preview database is a copy of
      # production, and a production pepper would let those copied accounts
      # authenticate against the preview. With a fresh one nobody can.
      - name: Preview secrets
        run: |
          jq -n --arg p "$(openssl rand -base64 32)" --arg j "$(openssl rand -base64 32)" \
            '{AUTH_PEPPER: $p, JWT_SECRET: $j}' > "$RUNNER_TEMP/preview-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/preview-secrets.json" --env preview
          rm -f "$RUNNER_TEMP/preview-secrets.json"

      - name: Resolve the preview URL
        id: url
        run: |
          url="${{ steps.deploy.outputs.deployment-url }}"
          if [ -z "$url" ]; then
            url=$(printf '%s' "$OUTPUT" | grep -oE 'https://workwarden-preview\.[a-z0-9-]+\.workers\.dev' | head -1)
          fi
          [ -n "$url" ] || { echo "could not determine the preview URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          OUTPUT: ${{ steps.deploy.outputs.command-output }}

      - name: Smoke test the preview
        run: node scripts/smoke.mjs "${{ steps.url.outputs.url }}"
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}

      # The claim in compat/README.md, defended rather than asserted: an
      # unmodified @bitwarden/cli logs in, writes an item, syncs, and decrypts
      # what it reads back. Six protocol gaps were found this way, every one of
      # them a 200 from the server followed by a crash inside the client.
      - name: Bitwarden client compatibility
        run: BASE="${{ steps.url.outputs.url }}" compat/run.sh
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}

      # The restore path, proven on every PR rather than assumed. The keypair is
      # generated here and thrown away: CI must never hold the identity that
      # decrypts production backups, only the recipient that writes them.
      - name: Backup restores a working vault
        run: |
          sudo apt-get install -y --no-install-recommends age >/dev/null
          age-keygen -o "$RUNNER_TEMP/ci.key" 2>/dev/null
          AGE_IDENTITY="$RUNNER_TEMP/ci.key" \
          AGE_RECIPIENT="$(grep -oP '^# public key: \K.*' "$RUNNER_TEMP/ci.key")" \
          BASE="${{ steps.url.outputs.url }}" \
            compat/verify-backup.sh
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}

      - name: Comment the preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = '${{ steps.url.outputs.url }}'
            const body = `Preview: ${url}\n\nOwn Neon branch \`${process.env.RESOURCE}\`, migrated and smoke-tested. Removed when this PR closes.`
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            })
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith('Preview:'))
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })

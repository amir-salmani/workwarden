# Each pull request gets its own Neon branch and its own Hyperdrive config, so a
# preview never touches production data. preview-cleanup.yml removes both when
# the PR closes.
name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: flat-heart-18148850
  RESOURCE: pr-${{ github.event.number }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # A branch is a copy-on-write clone, so this is near-instant and isolated.
      # Reset, not reused: a preview carries the migrations it ran last time,
      # and a newer master can add one that sorts before them.
      - name: Neon branch for this PR
        id: neon
        run: |
          uri=$(node scripts/neon-branch.mjs reset "$RESOURCE")
          echo "::add-mask::$uri"
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - name: Migrate the PR branch
        run: npm run migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}

      - name: Hyperdrive config for this PR
        id: hyperdrive
        run: |
          id=$(node scripts/hyperdrive.mjs upsert "workwarden-$RESOURCE" "$URI")
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          URI: ${{ steps.neon.outputs.uri }}

      # The binding id is baked into wrangler.jsonc, so point this upload at the
      # PR's config instead of production's.
      - name: Point the binding at the PR config
        run: |
          node -e '
            const fs = require("node:fs")
            const f = "wrangler.jsonc"
            const s = fs.readFileSync(f, "utf8")
            const next = s.replace(/"id": "[0-9a-f]{32}"/, `"id": "${process.env.HYPERDRIVE_ID}"`)
            if (next === s) throw new Error("did not find the Hyperdrive id to replace")
            fs.writeFileSync(f, next)
          '
        env:
          HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}

      - name: Upload a preview version
        id: upload
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      - name: Resolve the preview URL
        id: url
        run: |
          url="${{ steps.upload.outputs.deployment-url }}"
          if [ -z "$url" ]; then
            url=$(printf '%s' "$OUTPUT" | grep -oE 'https://[a-z0-9-]+\.workers\.dev' | head -1)
          fi
          [ -n "$url" ] || { echo "could not determine the preview URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          OUTPUT: ${{ steps.upload.outputs.command-output }}

      - name: Smoke test the preview
        run: node scripts/smoke.mjs "${{ steps.url.outputs.url }}"
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}

      # The claim in compat/README.md, defended rather than asserted: an
      # unmodified @bitwarden/cli logs in, writes an item, syncs, and decrypts
      # what it reads back. Six protocol gaps were found this way, every one of
      # them a 200 from the server followed by a crash inside the client.
      - name: Bitwarden client compatibility
        run: BASE="${{ steps.url.outputs.url }}" compat/run.sh
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}

      # The restore path, proven on every PR rather than assumed. The keypair is
      # generated here and thrown away: CI must never hold the identity that
      # decrypts production backups, only the recipient that writes them.
      - name: Backup restores a working vault
        run: |
          sudo apt-get install -y --no-install-recommends age >/dev/null
          age-keygen -o "$RUNNER_TEMP/ci.key" 2>/dev/null
          AGE_IDENTITY="$RUNNER_TEMP/ci.key" \
          AGE_RECIPIENT="$(grep -oP '^# public key: \K.*' "$RUNNER_TEMP/ci.key")" \
          BASE="${{ steps.url.outputs.url }}" \
            compat/verify-backup.sh
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}

      - name: Comment the preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = '${{ steps.url.outputs.url }}'
            const body = `Preview: ${url}\n\nOwn Neon branch \`${process.env.RESOURCE}\`, migrated and smoke-tested. Removed when this PR closes.`
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            })
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith('Preview:'))
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })

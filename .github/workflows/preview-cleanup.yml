# Previews are not free to leave lying around: each holds a Neon branch and a
# Hyperdrive config, and the free plan allows 10 branches per project.
name: preview-cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: flat-heart-18148850
  RESOURCE: pr-${{ github.event.number }}

jobs:
  cleanup:
    # Dependabot pull requests are not given repository secrets, so a preview
    # would fail on the first API call and make every bump look broken.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Both are idempotent: they exit quietly when there is nothing to remove.
      - run: node scripts/hyperdrive.mjs delete "workwarden-$RESOURCE"
      - run: node scripts/neon-branch.mjs delete "$RESOURCE"

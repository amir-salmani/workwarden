name: deploy

# Runs after ci succeeds on master, never alongside it. Triggering on push
# meant a failing check never stopped a deploy -- six red commits shipped.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # The commit ci checked, not whatever master points at by now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Migrate
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      # Hyperdrive caching lives on the Cloudflare config, not in this repo, so
      # nothing here would notice it being turned back on. It must stay off: a
      # cached read once made a freshly registered user unable to log in, and
      # would keep a revoked session alive past its revocation.
      - name: Hyperdrive query caching is disabled
        run: node scripts/hyperdrive.mjs check workwarden-neon
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Proves the Worker, the Hyperdrive config and Neon are wired to each
      # other. Creates a real account, syncs a real cipher, deletes both.
      - name: Smoke test
        run: node scripts/smoke.mjs "$WORKER_URL"
        env:
          WORKER_URL: https://vault.amirsalmani.com
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

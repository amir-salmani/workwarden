name: deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Migrate
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      # Hyperdrive caching lives on the Cloudflare config, not in this repo, so
      # nothing here would notice it being turned back on. It must stay off: a
      # cached read once made a freshly registered user unable to log in, and
      # would keep a revoked session alive past its revocation.
      - name: Hyperdrive query caching is disabled
        run: |
          npx wrangler hyperdrive get "$HYPERDRIVE_ID" > /tmp/hd.json
          node -e '
            const c = require("/tmp/hd.json").caching
            if (c?.disabled !== true) {
              console.error("Hyperdrive caching is enabled. Run: wrangler hyperdrive update $HYPERDRIVE_ID --caching-disabled")
              process.exit(1)
            }
            console.log("caching disabled: ok")
          '
        env:
          HYPERDRIVE_ID: eace91137a9649659e5fcd5011063257
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Proves the Worker, the Hyperdrive config and Neon are wired to each
      # other. Creates a real account, syncs a real cipher, deletes both.
      - name: Smoke test
        run: node scripts/smoke.mjs "$WORKER_URL"
        env:
          WORKER_URL: https://workwarden.cfworkerofabrinocloud.workers.dev
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

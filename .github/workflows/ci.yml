name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: workwarden
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:dev@127.0.0.1:5432/workwarden?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Migrate
        run: npm run migrate

      - name: Schema is in sync with the migrations
        run: |
          npm run schema
          git diff --exit-code db/schema.sql

      - name: Lint and format
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The umbrella net. Fails when the committed route table and the app disagree.
      - name: Route surface
        run: npm run routes:check

      - name: Test
        run: npm test

      # Dev-only advisories are excluded: sharp reaches us through miniflare and
      # never ships to the Worker.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high


name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The umbrella net. Fails when the committed route table and the app disagree.
      - name: Route surface
        run: npm run routes:check

      - name: Test
        run: npm test

      # Dev-only advisories are excluded: sharp reaches us through miniflare and
      # never ships to the Worker.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high


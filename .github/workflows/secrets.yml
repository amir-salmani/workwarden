# Worker secrets are pushed from here, not from anyone's laptop -- so rotating
# one is a recorded Actions run rather than an undocumented local command.
#
# Change the value in GitHub secrets, then run this workflow.
name: secrets

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Push secrets to the Worker
        run: |
          jq -n --arg pepper "$AUTH_PEPPER" --arg jwt "$JWT_SECRET" \
            '{AUTH_PEPPER: $pepper, JWT_SECRET: $jwt}' > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json
        env:
          AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      # This workflow is the source of truth for which secrets the Worker has.
      # Anything else is left over -- the Phase 0 SPIKE_ user was exactly that.
      - name: Prune secrets this workflow does not manage
        run: |
          npx wrangler secret list --format json > /tmp/have.json
          node -e '
            const keep = new Set(["AUTH_PEPPER", "JWT_SECRET"])
            const extra = require("/tmp/have.json").filter((s) => !keep.has(s.name))
            for (const s of extra) console.log(s.name)
          ' > /tmp/extra.txt
          while read -r name; do
            [ -n "$name" ] || continue
            echo "deleting $name"
            npx wrangler secret delete "$name" --force
          done < /tmp/extra.txt
